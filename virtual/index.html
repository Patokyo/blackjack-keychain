<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackjack Keychain — Virtual</title>
<style>
  :root {
    --seg-on: #ff3b2f;
    --seg-off: #0c0706;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 24px;
    background: radial-gradient(circle at 50% 0%, #171d21, #060809 70%);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  /* The board is 50 x 70 mm. Everything placed on it is positioned as a
     percentage of that box, measured from the board origin (131.5, 54). */

  .board {
    position: relative;
    width: min(420px, 92vw);
    aspect-ratio: 50 / 70;
    filter: drop-shadow(0 26px 34px #000c) drop-shadow(0 2px 3px #0008);
    /* a long press on the board should press the keys, not start a
       text selection or the image copy callout */
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  .art {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  /* soldermask choice: one plotted board per colour */

  .board[data-finish="blue"] .art-red,
  .board[data-finish="red"] .art-blue {
    display: none;
  }

  .finish {
    display: flex;
    gap: 12px;
  }

  .swatch {
    width: 20px;
    height: 20px;
    padding: 0;
    border: 1px solid #0009;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: inset 0 1px 0 #ffffff59;
  }

  .swatch[data-finish="blue"] { background: linear-gradient(#20588c, #0b2743); }
  .swatch[data-finish="red"]  { background: linear-gradient(#8e2a2c, #3f1013); }

  .swatch[aria-checked="true"] {
    outline: 1px solid #c9a25d;
    outline-offset: 2px;
  }

  .swatch:focus-visible {
    outline: 2px solid #c9a25d;
    outline-offset: 3px;
  }

  /* ---------- display, U2 at 157.26, 68.21 ---------- */

  .display {
    position: absolute;
    left: 29%;
    top: 12.607%;
    width: 42%;
    height: 11.786%;
    display: flex;
    gap: 2.6%;
    pointer-events: none;
  }

  .digit-pair {
    display: flex;
    flex: 1 1 0;
    gap: 5.4%;
  }

  .digit {
    flex: 1 1 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .digit line {
    stroke: var(--seg-off);
    stroke-width: 8;
    stroke-linecap: round;
  }

  .digit line.on {
    stroke: var(--seg-on);
    filter: drop-shadow(0 0 3px #ff3b2fbb);
  }

  /* ---------- LEDs, D1-D7 ---------- */

  .led {
    position: absolute;
    width: 11%;
    height: 7.857%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    /* white hot centre, coloured body, then two stacked shadows for the
       glow. plus-lighter adds the light to the board underneath instead
       of painting a pale disc over it, so a lit LED still reads on a
       bright phone screen (screen is the fallback for older Safari). */
    background: radial-gradient(circle at 50% 45%,
                #fff 0%, #fff 9%, var(--c) 32%, #0000 70%);
    mix-blend-mode: screen;
    mix-blend-mode: plus-lighter;
    filter: drop-shadow(0 0 3px var(--c))
            drop-shadow(0 0 10px var(--c));
    transition: opacity 0.1s linear;
  }

  .led.on { opacity: 1; }

  .led.pair    { --c: #ffc247; }
  .led.soft    { --c: #4fd6ff; }
  .led.win     { --c: #5ce07a; }
  .led.push    { --c: #ffd166; }
  .led.lose    { --c: #ff5a4d; }
  .led.correct { --c: #5ce07a; }
  .led.wrong   { --c: #ff5a4d; }

  /* ---------- buttons, SW1-SW5 ---------- */

  .key {
    position: absolute;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 22% / 34%;
    background: linear-gradient(#f2ede0 0%, #d9d2bf 46%, #b4ac95 100%);
    box-shadow:
      inset 0 1px 0 #ffffffb0,
      inset 0 -1px 0 #00000026,
      0 2px 3px #00000070;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    transition: transform 60ms ease, filter 90ms ease, box-shadow 60ms ease;
  }

  .key::after {
    content: "";
    position: absolute;
    inset: 24% 18%;
    border-radius: 16% / 40%;
    background: linear-gradient(#ded7c5, #c0b7a0);
    box-shadow: inset 0 0 0 1px #0000001f;
  }

  .key:hover:not(:disabled) { filter: brightness(1.04); }

  .key:active:not(:disabled) {
    transform: translateY(3%);
    filter: brightness(0.9);
    box-shadow: inset 0 0 2px #00000066, 0 0 1px #00000066;
  }

  .key:disabled {
    cursor: default;
    opacity: 0.8;
    filter: saturate(0.5) brightness(0.84);
  }

  .key:focus-visible,
  .switch:focus-visible {
    outline: 2px solid #e0bd72;
    outline-offset: 2px;
  }

  /* ---------- play / train switch, SW6 at 179.7, 106.5 ---------- */

  .switch {
    position: absolute;
    left: 94.2%;
    top: 71.857%;
    width: 5.6%;
    height: 7%;
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    touch-action: manipulation;
  }

  .knob {
    position: absolute;
    left: 21.4%;
    top: 12.24%;
    width: 64.3%;
    height: 34.7%;
    border-radius: 26%;
    background: linear-gradient(#fdfaf1 0%, #dcd7c9 55%, #9c978b 100%);
    box-shadow: 0 2px 3px #000c, inset 0 1px 0 #fff;
    transition: transform 0.12s ease;
  }

  .switch[aria-checked="false"] .knob { transform: translateY(123.5%); }

  .switch:hover .knob { filter: brightness(1.06); }

  @media (prefers-reduced-motion: reduce) {
    .key, .knob { transition: none; }
  }
</style>
</head>
<body>

<main>

  <!-- board-blue.svg and board-red.svg are generated by
       virtual/make_board.py from the gerbers in hardware/fabrication, so
       the copper, silk, pads and part outlines here match the real board.
       The overlays sit on the parts the game drives. -->

  <div class="board" data-finish="blue">

    <img class="art art-blue" src="board-blue.svg" width="500" height="700"
         draggable="false" alt="Front of the blackjack keychain board: a 50 by 70 millimetre PCB with a blue solder mask, four digit display, seven indicator LEDs, five tactile buttons, a slide switch and a USB-C socket.">
    <img class="art art-red" src="board-red.svg" width="500" height="700"
         draggable="false" alt="Front of the blackjack keychain board: a 50 by 70 millimetre PCB with a red solder mask, four digit display, seven indicator LEDs, five tactile buttons, a slide switch and a USB-C socket.">

    <!-- U2, four digit display -->
    <div class="display" aria-hidden="true">
      <div class="digit-pair" id="playerDigits"></div>
      <div class="digit-pair" id="dealerDigits"></div>
    </div>

    <!-- D1-D7, at the LED positions on the board -->
    <span class="led pair"    id="ledPair"    style="left: 15.684%; top: 43.644%"></span>
    <span class="led soft"    id="ledSoft"    style="left: 29.684%; top: 43.644%"></span>
    <span class="led win"     id="ledWin"     style="left: 51.716%; top: 43.644%"></span>
    <span class="led push"    id="ledPush"    style="left: 68.466%; top: 43.644%"></span>
    <span class="led lose"    id="ledLose"    style="left: 85.741%; top: 43.644%"></span>
    <span class="led correct" id="ledCorrect" style="left: 58.016%; top: 59.144%"></span>
    <span class="led wrong"   id="ledWrong"   style="left: 78.536%; top: 59.214%"></span>

    <!-- SW1-SW5, the tactile buttons -->
    <button class="key" data-action="H" aria-label="hit"
            style="left: 6%; top: 86.071%; width: 12%; height: 5%"></button>
    <button class="key" data-action="S" aria-label="stand"
            style="left: 31.333%; top: 86.19%; width: 12%; height: 5%"></button>
    <button class="key" data-action="D" aria-label="double"
            style="left: 56.667%; top: 86.071%; width: 12%; height: 5%"></button>
    <button class="key" data-action="P" aria-label="split"
            style="left: 82%; top: 86.071%; width: 12%; height: 5%"></button>
    <button class="key" data-action="B" aria-label="bank"
            style="left: 44%; top: 72.811%; width: 12%; height: 5%"></button>

    <!-- SW6, the play / train switch -->
    <button class="switch" id="modeSwitch" role="switch" aria-checked="true"
            aria-label="play / train switch"><span class="knob"></span></button>

  </div>

  <div class="finish" role="radiogroup" aria-label="Solder mask colour">
    <button class="swatch" data-finish="blue" role="radio" aria-checked="true"
            aria-label="blue solder mask"></button>
    <button class="swatch" data-finish="red" role="radio" aria-checked="false"
            aria-label="red solder mask"></button>
  </div>

</main>

<script src="game.js"></script>
<script src="ui.js"></script>
<script>
  (function () {

    'use strict';

    const board = document.querySelector('.board');
    const swatches = document.querySelectorAll('.swatch');

    // Android opens the image menu on a long press; the board is a control,
    // not something to save or copy.
    board.addEventListener('contextmenu', function (event) {
      event.preventDefault();
    });

    swatches.forEach(function (swatch) {

      swatch.addEventListener('click', function () {

        board.dataset.finish = swatch.dataset.finish;
        swatch.blur();

        swatches.forEach(function (other) {
          other.setAttribute('aria-checked', String(other === swatch));
        });
      });
    });

  })();
</script>

</body>
</html>
